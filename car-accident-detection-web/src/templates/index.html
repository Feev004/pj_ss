<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YOLO Detection</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #dff9fb, #c7ecee);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", sans-serif;
      }
      .card {
        border-radius: 20px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      }
      h1 {
        text-align: center;
        font-weight: bold;
        margin-bottom: 20px;
      }
      .btn-custom {
        padding: 8px 40px; /* 8px = บน-ล่าง , 40px = ซ้าย-ขวา */
        border-radius: 999px;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 10px auto; /* จัดปุ่มให้อยู่ตรงกลาง */
      }
      .form-label {
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card p-4">
        <h1>🚨 Car Accident Detection</h1>
        <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 20px;">
          Uses CLAHE enhancement + Dual Model (Accident Detection + Vehicle Counting)
        </p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                  <span aria-hidden="true">&times;</span>
                </button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Upload Section -->
        <form
          action="/upload"
          method="post"
          enctype="multipart/form-data"
          class="mb-4"
        >
          <div class="mb-3">
            <label class="form-label">Upload video file:</label>
            <input type="file" class="form-control" name="file" required />
          </div>
          <button type="submit" class="btn btn-primary btn-custom w-100">
            Upload & Detect
          </button>
        </form>

        <!-- URL Upload Section -->
        <!-- <div class="text-center mb-3">
          <span style="color: #666; font-size: 14px;">or</span>
        </div>
        <form action="/upload_url" method="post" class="mb-4">
          <div class="mb-3">
            <label class="form-label">Upload from URL:</label>
            <input
              type="url"
              class="form-control"
              name="video_url"
              placeholder="https://example.com/video.mp4 หรือ https://www.w3schools.com/html/mov_bbb.mp4"
              required
            />
            <small class="form-text text-muted">รองรับไฟล์วิดีโอจาก URL สาธารณะ</small>
          </div>
          <button type="submit" class="btn btn-success btn-custom w-100">
            Download & Detect
          </button>
        </form> -->

        <!-- Features Info -->
        <!-- <div class="alert alert-info" role="alert" style="font-size: 13px; margin-top: 20px;">
          <strong>Features:</strong>
          <ul style="margin: 10px 0 0 20px;">
            <li>✅ CLAHE Enhancement for better contrast</li>
            <li>✅ Accident Detection with confidence threshold</li>
            <li>✅ Vehicle Counting in accident area</li>
            <li>✅ Full-frame vehicle detection</li>
            <li>✅ Telegram Alerts (can be enabled)</li>
            <li>✅ Upload from file or URL</li>
            <li>✅ Performance metrics & evaluation</li>
          </ul>
        </div> -->
      </div>
    </div>
  </body>
</html>
